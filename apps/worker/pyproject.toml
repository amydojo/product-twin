[project]
name = "product-twin-worker"
version = "0.1.0"
description = "Deterministic packaging reconstruction and Blender render worker"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.128.2",
  "pydantic==2.13.4",
  "pydantic-settings==2.11.0",
  "uvicorn[standard]==0.35.0",
  "pillow==12.2.0",
  "numpy==2.3.5",
  "httpx==0.28.1",
  "python-multipart==0.0.20",
  "structlog==25.4.0",
]
[project.optional-dependencies]
models = ["transformers==5.0.0","torch==2.8.0","safetensors==0.6.2"]
dev = ["pytest==9.0.2","pytest-cov==6.2.1","ruff==0.12.5","mypy==1.17.0","jsonschema==4.26.0","trimesh==4.11.1"]
[project.scripts]
product-twin = "product_twin.cli:main"
[build-system]
requires=["hatchling==1.27.0"]
build-backend="hatchling.build"
[tool.hatch.build.targets.wheel]
packages=["product_twin"]
[tool.pytest.ini_options]
addopts="-q --strict-markers"
testpaths=["tests"]
[tool.ruff]
line-length=100
target-version="py311"
[tool.ruff.lint]
select=["E9","F","B","S"]
ignore=["S404","S603","S607"]
[tool.ruff.lint.per-file-ignores]
"tests/**"=["S101","S105","S106"]
[tool.mypy]
python_version="3.11"
strict=true
