name: Bootstrap Product Twin source

on:
  push:
    branches: [agent/product-twin-v0-1]
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap-product-twin.yml'

permissions:
  contents: write

concurrency:
  group: bootstrap-product-twin
  cancel-in-progress: false

jobs:
  bootstrap:
    if: ${{ hashFiles('.bootstrap/READY') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/product-twin-v0-1
          fetch-depth: 0
      - name: Reconstruct exact source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-* | base64 --decode > /tmp/product-twin.tar.gz
          expected="$(cat .bootstrap/SHA256)"
          actual="$(sha256sum /tmp/product-twin.tar.gz | awk '{print $1}')"
          test "$actual" = "$expected"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/product-twin.tar.gz
      - name: Publish vertical slice
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'amydojo'
          git config user.email '207778242+amydojo@users.noreply.github.com'
          git add -A
          git commit -m 'Build Product Twin v0.1 vertical slice'
          git push origin HEAD:agent/product-twin-v0-1
