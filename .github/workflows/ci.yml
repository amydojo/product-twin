name: CI

on:
  pull_request:
  push:
    branches: [main, agent/product-twin-v0-1]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.15.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm schema:check
      - run: pnpm audit --audit-level critical
      - run: pnpm build
        env:
          PRODUCT_TWIN_FIXTURE_MODE: "true"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: pnpm-lock
          path: pnpm-lock.yaml
          if-no-files-found: warn

  e2e:
    name: Fixture happy path
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.15.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @product-twin/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          PRODUCT_TWIN_FIXTURE_MODE: "true"

  worker:
    name: Worker quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.16"
          enable-cache: true
      - run: uv lock --project apps/worker
      - run: uv sync --project apps/worker --extra dev
      - run: uv run --project apps/worker ruff check apps/worker/product_twin apps/worker/tests
      - run: uv run --project apps/worker pytest apps/worker/tests
      - run: python scripts/check_schema_parity.py
      - run: python scripts/scan_secrets.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: uv-lock
          path: apps/worker/uv.lock
          if-no-files-found: warn

  migrations:
    name: Supabase migrations and RLS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v1
        with:
          version: 2.101.0
      - run: supabase start
      - run: supabase db reset
      - run: supabase test db
      - run: '! grep -R "auth.role()" supabase/migrations'

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/dependency-review-action@v4
