name: CI

on:
  pull_request:
  push:
    branches: [main, agent/product-twin-v0-1]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-lockfile:
    name: Refresh TypeScript lockfile
    if: github.event_name == 'push' && github.ref == 'refs/heads/agent/product-twin-v0-1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/product-twin-v0-1
      - uses: pnpm/action-setup@v6
        with:
          version: 11.15.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile already current."
            exit 0
          fi
          git commit -m "Update TypeScript lockfile"
          git push origin HEAD:agent/product-twin-v0-1

  web:
    name: Web quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.15.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install web dependencies
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee pnpm-web-install.log
      - name: Lint web and schema packages
        run: |
          set -o pipefail
          pnpm lint 2>&1 | tee pnpm-web-lint.log
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm schema:check
      - run: pnpm audit --audit-level critical
      - run: pnpm build
        env:
          PRODUCT_TWIN_FIXTURE_MODE: "true"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: pnpm-lock
          path: |
            pnpm-lock.yaml
            pnpm-web-install.log
            pnpm-web-lint.log
          if-no-files-found: warn

  e2e:
    name: Fixture happy path
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.15.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install e2e dependencies
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee pnpm-e2e-install.log
      - run: pnpm --filter @product-twin/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          PRODUCT_TWIN_FIXTURE_MODE: "true"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: pnpm-e2e-install-log
          path: pnpm-e2e-install.log
          if-no-files-found: warn

  worker:
    name: Worker quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.16"
          enable-cache: true
      - run: uv sync --project apps/worker --frozen --extra dev
      - name: Python lint
        run: |
          mkdir -p apps/worker/tmp
          set -o pipefail
          uv run --project apps/worker ruff check apps/worker/product_twin apps/worker/tests 2>&1 | tee apps/worker/tmp/ruff.log
      - run: uv run --project apps/worker pytest apps/worker/tests
      - run: uv run --project apps/worker python scripts/check_schema_parity.py
      - run: python scripts/scan_secrets.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: uv-lock
          path: |
            apps/worker/uv.lock
            apps/worker/tmp/ruff.log
          if-no-files-found: warn

  migrations:
    name: Supabase migrations and RLS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v1
        with:
          version: 2.101.0
      - run: supabase start
      - run: supabase db reset
      - name: Verify migrations and RLS
        run: |
          set -o pipefail
          supabase test db 2>&1 | tee supabase-test.log
      - run: '! grep -R "auth.role()" supabase/migrations'
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: supabase-test-log
          path: supabase-test.log
          if-no-files-found: warn
