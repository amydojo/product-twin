name: Materialize lockfiles

on:
  push:
    branches: [agent/product-twin-v0-1]
    paths:
      - .github/workflows/materialize-lockfiles.yml

permissions:
  contents: write

jobs:
  lockfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/product-twin-v0-1
      - uses: pnpm/action-setup@v6
        with:
          version: 11.15.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.16"
      - run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
      - run: uv lock --project apps/worker
      - name: Commit generated lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml apps/worker/uv.lock
          if git diff --cached --quiet; then
            echo "Lockfiles already current."
            exit 0
          fi
          git commit -m "Commit generated lockfiles"
          git push origin HEAD:agent/product-twin-v0-1
