name: Materialize TypeScript lock

on:
  workflow_dispatch:
  push:
    branches: [agent/product-twin-v0-1]
    paths:
      - .github/workflows/materialize-typescript-lock.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/product-twin-v0-1
      - uses: pnpm/action-setup@v6
        with:
          version: 11.15.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile already current."
            exit 0
          fi
          git commit -m "Update TypeScript lockfile"
          git push origin HEAD:agent/product-twin-v0-1
