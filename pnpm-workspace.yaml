packages:
  - apps/web
  - packages/*

# pnpm 11 blocks all dependency build scripts unless they are reviewed explicitly.
# sharp is used by Next.js image tooling; unrs-resolver provides ESLint's native resolver.
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

overrides:
  postcss: 8.5.22
  sharp: 0.35.0
